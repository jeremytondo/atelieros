# On bootc, / is a composefs overlay with no block device behind it, so
# cloud-init's growpart skips it, and resizefs logs a warning that makes
# `cloud-init status` exit 2.
#
# The base image grows the root instead. bootc-generic-growpart.service runs
# in VMs before basic.target, and so before cloud-init. It grows the
# partition behind /sysroot and runs systemd-growfs on it. Once it finishes,
# it shows as inactive (dead).
growpart:
  mode: "off"
resize_rootfs: false
